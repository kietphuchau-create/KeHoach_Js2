name: MedSched CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # -------------------------------------------------------------
  # Job 1: Kiểm thử & Đóng gói Backend (Java 21 + Spring Boot 3)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Spring Boot & Gradle)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Source_code/backend

    steps:
      - name: Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: Cài Đặt Môi Trường JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cấp Quyền Thực Thi Cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Biên Dịch & Chạy Kiểm Thử Tự Động (JUnit 5)
        run: ./gradlew test --no-daemon

      - name: Đóng Gói Ứng Dụng (Build bootJar)
        run: ./gradlew :app:bootJar --no-daemon -x test

      - name: Lưu File Artifact Jar (Phục vụ Deploy)
        uses: actions/upload-artifact@v4
        with:
          name: backend-bootjar
          path: Source_code/backend/app/build/libs/*.jar
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Kiểm thử & Đóng gói Frontend (Next.js 15 + React 19)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Source_code/frontend

    steps:
      - name: Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: Cài Đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Khôi Phục Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Source_code/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cài Đặt Thư Viện Phụ Thuộc
        run: pnpm install --no-frozen-lockfile

      - name: Kiểm Tra Kiểu Dữ Liệu TypeScript (Type-Check)
        run: pnpm exec tsc --noEmit

      - name: Biên Dịch Đóng Gói Bản Build Production
        env:
          NEXT_PUBLIC_API_URL: https://medsched-api.onrender.com/api/v1
        run: pnpm build

  # -------------------------------------------------------------
  # Job 3: Thông Báo Tình Trạng CI/CD
  # -------------------------------------------------------------
  ci-status:
    name: CI Pipeline Status Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Đánh Giá Kết Quả Pipeline
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "❌ Pipeline CI thất bại! Vui lòng kiểm tra lại log lỗi kiểm thử ở trên."
            exit 1
          fi
          echo "✅ Tất cả các bài kiểm tra Backend & Frontend đều PASS hoàn hảo!"
