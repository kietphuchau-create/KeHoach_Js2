# Đồ án chạy bằng XAMPP: chỉ cần bật MySQL trong XAMPP Control Panel rồi
# ./gradlew bootRun là kết nối được, không cần Docker, không cần cấu hình thêm.
spring:
  application:
    name: medsched
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medsched_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway là nguồn sự thật duy nhất cho schema; Hibernate chỉ đối chiếu
      # (validate), không tự sinh/sửa bảng - tránh lệch schema giữa các máy.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

# Task 1 - cấu hình xác thực JWT và CORS cho frontend Next.js
medsched:
  jwt:
    # BẮT BUỘC đổi bằng biến môi trường JWT_SECRET khi chạy thật (tối thiểu 32 ký tự).
    secret: ${JWT_SECRET:medsched-dev-secret-key-doi-truoc-khi-deploy-32k}
    access-ttl: PT30M
    refresh-ttl: P7D
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
