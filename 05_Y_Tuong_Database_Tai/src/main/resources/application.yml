# Mặc định: profile "postgres" - chính thức nộp báo cáo, dùng PGVector cho RAG y khoa sau này.
# Đổi sang XAMPP/MySQL cục bộ bằng: --spring.profiles.active=mysql-xampp
spring:
  application:
    name: medsched-persistence-prototype
  profiles:
    active: postgres
  jpa:
    hibernate:
      # Flyway là nguồn sự thật duy nhất cho schema; Hibernate chỉ đối chiếu (validate),
      # không tự sinh/sửa bảng - tránh lệch schema giữa các môi trường của từng thành viên.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medsched_db}
    username: ${DB_USER:medsched}
    password: ${DB_PASSWORD:medsched}
  flyway:
    locations: classpath:db/migration/postgresql

---
spring:
  config:
    activate:
      on-profile: mysql-xampp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medsched_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration/mysql
