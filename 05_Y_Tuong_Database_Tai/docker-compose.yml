# Chỉ dùng cho profile "postgres" (mặc định). Với profile "mysql-xampp" thì
# KHÔNG cần Docker - chỉ cần bật MySQL trong XAMPP Control Panel là đủ (xem
# mục 5.3 trong ../04_Database_Design/Database_Design.md).
services:
  db:
    image: postgres:16-alpine
    container_name: medsched-persistence-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsched_db}
      POSTGRES_USER: ${POSTGRES_USER:-medsched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medsched}
    ports:
      - "5432:5432"
    volumes:
      - medsched-persistence-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medsched} -d ${POSTGRES_DB:-medsched_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medsched-persistence-db-data:
