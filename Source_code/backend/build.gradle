plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.medsched'
    version = '1.3.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    jacoco {
        toolVersion = "0.8.12"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'user.timezone', 'Asia/Ho_Chi_Minh'
        systemProperty 'file.encoding', 'UTF-8'
        testLogging {
            events "failed", "skipped"
            showExceptions true
            showCauses true
            showStackTraces true
            exceptionFormat "full"
        }
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            csv.required = true
            html.required = true
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/persistence/entity/**',
                    '**/persistence/enums/**',
                    '**/app/config/**',
                    '**/MedSchedApplication*',
                    '**/*Dto*',
                    '**/*Dtos*',
                    '**/*Request*',
                    '**/*Response*',
                    '**/core/port/**'
                ])
            }))
        }
    }
}

task jacocoRootReport(type: JacocoReport) {
    dependsOn subprojects.test
    dependsOn subprojects.jacocoTestReport

    additionalSourceDirs.from = files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.from = files(subprojects.sourceSets.main.allSource.srcDirs)
    
    classDirectories.from = files(subprojects.collect { project ->
        fileTree(dir: "${project.layout.buildDirectory.get()}/classes/java/main", exclude: [
            '**/persistence/entity/**',
            '**/persistence/enums/**',
            '**/app/config/**',
            '**/MedSchedApplication*',
            '**/*Dto*',
            '**/*Dtos*',
            '**/*Request*',
            '**/*Response*',
            '**/core/port/**'
        ])
    })
    executionData.from = files(subprojects.jacocoTestReport.executionData).filter { it.exists() }

    reports {
        html.required = true
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/all")
    }
}
