server:
  port: 8080

spring:
  application:
    name: medsched
  profiles:
    active: mysql-xampp
  jpa:
    hibernate:
      # database/medsched_db.sql la nguon su that duy nhat cua schema.
      # Dung "validate": Hibernate chi doi chieu, khong tu y ALTER bang.
      # ("update" truoc day khien ung dung khong khoi dong duoc vi Hibernate co
      #  sua cot dang bi khoa ngoai tham chieu.)
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false

# Spring AI: neu khong dat bien moi truong OPENAI_API_KEY thi van cho ung dung
# khoi dong (chi cac API goi AI moi bao loi). Truoc day thieu key la CA backend
# khong chay duoc, chan luon ca nguoi lam Auth / Dat lich / Frontend.
spring.ai.openai.api-key: ${OPENAI_API_KEY:chua-cau-hinh}

medsched:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-duration: 3600s
    refresh-token-duration: 604800s
  cors:
    allowed-origins: http://localhost:3000

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400

---
# Cấu hình kết nối MySQL trong XAMPP (Mặc định cho toàn bộ thành viên trong nhóm)
spring:
  config:
    activate:
      on-profile: mysql-xampp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medsched_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

