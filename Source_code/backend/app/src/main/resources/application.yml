server:
  port: 8080

spring:
  application:
    name: medsched
  profiles:
    active: mysql-xampp
  jpa:
    hibernate:
      # database/medsched_db.sql is the single source of truth for the schema.
      # "validate" means Hibernate only checks it and is never allowed to ALTER
      # tables. ("update" used to stop the application from starting because
      # Hibernate tried to change columns referenced by foreign keys.)
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-medsched-local-api-key}

# Spring AI: without the OPENAI_API_KEY environment variable the application
# still starts; only the AI endpoints fail. Previously a missing key stopped the
# WHOLE backend, blocking everyone working on Auth / Booking / Frontend.
spring.ai.openai.api-key: ${OPENAI_API_KEY:chua-cau-hinh}

medsched:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-duration: 3600s
    refresh-token-duration: 604800s
  cors:
    allowed-origins: http://localhost:3000

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400

---
# MySQL connection for XAMPP (the default every team member uses)
spring:
  config:
    activate:
      on-profile: mysql-xampp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medsched_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

