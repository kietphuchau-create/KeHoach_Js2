    delete:
      tags: [Catalog]
      summary: Ngừng hoạt động cơ sở y tế (ADMIN)
      description: Soft delete - đặt `active = false`, KHÔNG xóa dữ liệu để giữ lịch sử khám.
      parameters:
        - name: id
          in: path
          required: true
