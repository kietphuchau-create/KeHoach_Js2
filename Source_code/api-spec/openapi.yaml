      description: Soft delete - đặt `active = false` để hóa đơn cũ vẫn tra được tên dịch vụ.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Thành công. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/appointments:
    post:
      tags: [Appointments]
      summary: Đặt lịch khám
      description: |
        Giữ chỗ slot bằng compare-and-set (chỉ đổi được khi slot đang AVAILABLE).
        Hai người cùng bấm một slot: người sau nhận 409.
        Nếu có `symptoms`, hệ thống tự sinh `aiSummary` cho bác sĩ đọc trước.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookAppointmentRequest' }
      responses:
        '201':
          description: Đặt lịch thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Không tìm thấy khung giờ khám.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Khung giờ đã có người đặt trước hoặc tạm khóa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                timestamp: "2026-09-14T06:47:47Z"
                status: 409
                error: Conflict
                message: Khung giờ này đã có người đặt trước hoặc tạm khóa
                path: /api/appointments
                fieldErrors: null

  /api/appointments/{id}:
    get:
      tags: [Appointments]
      summary: Xem chi tiết một ca khám theo id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Không tìm thấy ca khám. }

  /api/appointments/booking-code/{code}:
    get:
      tags: [Appointments]
      summary: Tra ca khám theo mã đặt chỗ (bookingCode)
      description: Dùng ở quầy tiếp đón khi bệnh nhân đưa vé hẹn.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: MED269780
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Không tìm thấy ca khám với mã này. }

  /api/appointments/patient/{patientProfileId}:
    get:
      tags: [Appointments]
      summary: Lịch sử khám của một hồ sơ bệnh nhân
      description: Sắp xếp mới nhất trước. Hiện chưa có pagination - xem mục "Chuẩn API List" trong README.
      parameters:
        - name: patientProfileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/reception/checkin/qr:
    post:
      tags: [Reception]
      summary: Check-in bằng mã QR trên vé hẹn
      description: |
        Chuyển trạng thái ca khám sang `CHECKED_IN` và ghi `checkinMethod = QR_CODE`.

        CẢNH BÁO: endpoint này hiện CHƯA giới hạn role - mọi tài khoản đăng nhập
        đều gọi được. Cần bổ sung `@PreAuthorize("hasRole('STAFF')")`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrCheckinRequest' }
      responses:
        '200':
          description: Check-in thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Không tìm thấy lịch hẹn với mã này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/reception/checkin/cccd:
    post:
      tags: [Reception]
      summary: Check-in bằng thẻ CCCD gắn chip
      description: |
        Dùng cho khách vãng lai chưa đặt lịch: cấp số thứ tự chờ dạng `WLK-xxx`.
        Hiện `appointment` trả về null vì chưa tạo ca khám - phần tạo ca khám cho
        khách vãng lai thuộc giai đoạn sau.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CccdCheckinRequest' }
      responses:
        '200':
          description: Tiếp đón thành công.
          content:
            application/json:
