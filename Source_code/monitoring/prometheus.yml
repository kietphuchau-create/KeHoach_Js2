# Cấu hình Scrape Metrics cho Prometheus từ MedSched Backend
global:
  scrape_interval: 5s        # Tần suất cào dữ liệu: 5 giây một lần
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'medsched-backend-render'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['medsched-zu15.onrender.com:443']

  - job_name: 'medsched-backend-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal tro ve may host khi chay Backend local (cong 8080)
      - targets: ['host.docker.internal:8080']

