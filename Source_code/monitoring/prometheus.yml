# Cấu hình Scrape Metrics cho Prometheus từ MedSched Backend
global:
  scrape_interval: 5s        # Tần suất cào dữ liệu: 5 giây một lần
  evaluation_interval: 5s

scrape_configs:
  # =========================================================================
  # 1. THEO DÕI DỰ ÁN THẬT TRÊN MÁY CHỦ CLOUD (RENDER PRODUCTION)
  # =========================================================================
  - job_name: 'medsched-cloud-render'
    scheme: https
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['medsched-zu15.onrender.com:443']

  # =========================================================================
  # 2. THEO DÕI DỰ ÁN LOCAL TRÊN MÁY TÍNH CÁ NHÂN (KHI DEV / OFFLINE)
  # =========================================================================
  - job_name: 'medsched-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
