# ==============================================================================
# HỆ THỐNG ĐẶT LỊCH KHÁM & TIẾP ĐÓN THÔNG MINH - MEDSCHED PRO
# REQ-OPS-01: Docker Compose chuẩn Production (Backend Spring Boot 3 + MySQL 8.0)
# ==============================================================================

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medsched-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medsched_db
      MYSQL_USER: medsched_user
      MYSQL_PASSWORD: medsched_pass
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/medsched_db.sql:/docker-entrypoint-initdb.d/01_medsched_db.sql:ro
    networks:
      - medsched-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsched-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medsched_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      MEDSCHED_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      MEDSCHED_JWT_ACCESS_EXPIRATION: 3600
      MEDSCHED_JWT_REFRESH_EXPIRATION: 604800
      MEDSCHED_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://medsched.vn
      PORT: 8080
      TZ: Asia/Ho_Chi_Minh
    networks:
      - medsched-network

networks:
  medsched-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

